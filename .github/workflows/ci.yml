name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for credentials
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts=--all --redact=100
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false
      - run: node scripts/check-source.mjs
      - run: npm ci
      - run: python -m pip install -e ./sdk/python
      - run: npm run check && npm run test:parity
      - run: npm run build:production && npm run build:compiler
      - name: Native Git, feature and SDK integration
        env:
          PYTHON_BINARY: python
          GO_BINARY: go
        run: |
          npm run dev > /tmp/onestorage-dev.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8787/api/health; then break; fi
            sleep 1
          done
          npm run test:e2e && npm run test:features && npm run test:git-features && npm run test:sdks || { cat /tmp/onestorage-dev.log; exit 1; }
      - name: Public GitHub interoperability (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm run dev > /tmp/onestorage-dev.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8787/api/health; then break; fi
            sleep 1
          done
          npm run test:sync || { cat /tmp/onestorage-dev.log; exit 1; }
